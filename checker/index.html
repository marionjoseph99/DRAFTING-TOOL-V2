<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF QC Crosschecker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <i class="fa-solid fa-code-compare"></i>
        <div>
          <h1>PDF QC Crosschecker</h1>
          <p>Validate HTML fields against the CAD PDF</p>
        </div>
      </div>
      <a href="../countertop_crosschecker.html" class="back-link">Back to tools</a>
    </header>

    <main class="content-card">
      <div class="upload-grid">
        <div class="upload-box">
          <input type="file" id="html-upload" accept=".html" />
          <div class="upload-inner">
            <i class="fa-brands fa-html5"></i>
            <h2 id="html-filename">Upload HTML</h2>
          </div>
        </div>

        <div class="upload-box">
          <input type="file" id="pdf-upload" accept=".pdf" />
          <div class="upload-inner">
            <i class="fa-solid fa-file-pdf"></i>
            <h2 id="pdf-filename">Upload PDF</h2>
          </div>
        </div>
      </div>

      <div class="button-row">
        <button id="btn-crosscheck" class="primary-btn hidden">Run Crosscheck</button>
      </div>

      <div id="processing-state" class="processing hidden">Processing documents...</div>

      <div id="results-container" class="result-box hidden">
        <div class="result-header">
          <h3>Crosscheck Results</h3>
          <span id="status-badge">Pending</span>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Detail</th>
                <th>HTML</th>
                <th>PDF</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="results-table-body"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
