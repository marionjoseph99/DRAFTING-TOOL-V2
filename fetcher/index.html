<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML Details Fetcher</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <i class="fa-solid fa-file-code"></i>
        <div>
          <h1>HTML Details Fetcher</h1>
          <p>Extract supported CAD details from a Systemize HTML file</p>
        </div>
      </div>
      <a href="../countertop_crosschecker.html" class="back-link">Back to tools</a>
    </header>

    <main class="content-card">
      <div class="status-bar">
        <div id="extraction-status" class="status-pill neutral">Waiting for HTML</div>
        <div id="validation-summary" class="summary-box">Upload a Systemize HTML file to begin.</div>
      </div>

      <div class="upload-box" id="upload-box">
        <input type="file" id="html-upload" accept=".html" />
        <div class="upload-inner">
          <i class="fa-brands fa-html5"></i>
          <h2 id="html-filename">Upload Systemize HTML</h2>
          <p>Required to extract the job details block</p>
        </div>
      </div>

      <div class="button-row">
        <button id="btn-fetch" class="primary-btn hidden">Extract CAD Details</button>
        <button id="btn-demo" class="secondary-btn subtle">Load Demo</button>
        <button id="btn-reset" class="secondary-btn subtle">Reset</button>
      </div>

      <div id="fetcher-results" class="result-box hidden">
        <div class="result-header">
          <div>
            <h3>Extracted CAD Block Data</h3>
            <small id="field-summary">Ready</small>
          </div>
          <div class="header-actions">
            <button id="btn-copy" class="secondary-btn">Copy</button>
            <button id="btn-download" class="secondary-btn">Download .txt</button>
          </div>
        </div>
        <textarea id="extracted-text-area" readonly></textarea>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
